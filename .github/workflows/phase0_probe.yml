name: Phase0 Probe

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: "Qt / PySide6 版本（必须有官方 android_aarch64 wheel）"
        required: true
        default: "6.8.3"
      ndk_version:
        description: "Android NDK 版本"
        required: true
        default: "28.2.13676358"
      run_cross_compile:
        description: "是否额外执行交叉编译 wheel 的 job（约 2-4 小时）"
        type: boolean
        default: false

concurrency:
  group: phase0-probe
  cancel-in-progress: false

env:
  QT_VERSION: ${{ inputs.qt_version }}
  NDK_VERSION: ${{ inputs.ndk_version }}
  ANDROID_API: "35"
  HOST_PYTHON: "3.11"
  QT_ROOT: ${{ github.workspace }}/.qt
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  deploy-apk:
    name: A / 官方 wheel -> APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 基线信息（磁盘 / 内存 / 核数 / 预装 NDK / Java）
        run: |
          date
          df -h /
          free -h
          nproc
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
          java -version || true

      - name: 释放磁盘空间（目标 +20 GB）
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf "$ANDROID_HOME/ndk/"* || true
          df -h /

      - name: 安装 Python ${{ env.HOST_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 接受许可并安装 SDK / NDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-$ANDROID_API" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          ls "$ANDROID_HOME/ndk"

      - name: 用 aqt 安装 Qt for Android
        run: |
          python -m pip install --upgrade pip aqtinstall
          aqt install-qt linux android "$QT_VERSION" android_arm64_v8a -O "$QT_ROOT"
          ls "$QT_ROOT/$QT_VERSION"
          du -sh "$QT_ROOT"

      - name: 安装 Android Command-line Tools
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          CMDLINE_TOOLS_DIR="$SDK_ROOT/cmdline-tools"
          LATEST_DIR="$CMDLINE_TOOLS_DIR/latest"
          rm -rf "$CMDLINE_TOOLS_DIR"
          mkdir -p "$LATEST_DIR"
          TEMP_ZIP="$RUNNER_TEMP/cmdline-tools.zip"
          TEMP_UNZIP="$RUNNER_TEMP/cmdline-tools-unzip"
          curl -fsSL -o "$TEMP_ZIP" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$TEMP_ZIP" -d "$TEMP_UNZIP"
          mv "$TEMP_UNZIP/cmdline-tools/"* "$LATEST_DIR/"
          chmod +x "$LATEST_DIR/bin/"*
          export PATH="$LATEST_DIR/bin:$PATH"
          echo "sdkmanager version: $($LATEST_DIR/bin/sdkmanager --version)"
          echo "$LATEST_DIR/bin" >> $GITHUB_PATH
          # buildozer 1.5.0 只认 $ANDROID_HOME/tools/bin/sdkmanager，这里补兼容软链
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$LATEST_DIR/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$LATEST_DIR/bin/avdmanager" "$SDK_ROOT/tools/bin/avdmanager"
          ls -l "$SDK_ROOT/tools/bin"

      - name: 下载官方 Android 轮子并记录 sha256
        run: |
          set -euo pipefail
          mkdir -p wheels
          BASE=https://download.qt.io/official_releases/QtForPython
          PS="PySide6-$QT_VERSION-$QT_VERSION-cp311-cp311-android_aarch64.whl"
          SB="shiboken6-$QT_VERSION-$QT_VERSION-cp311-cp311-android_aarch64.whl"
          curl -fL --retry 3 -o "wheels/$PS" "$BASE/pyside6/$PS"
          curl -fL --retry 3 -o "wheels/$SB" "$BASE/shiboken6/$SB"
          sha256sum wheels/*.whl | tee wheels/SHA256SUMS
          ls -lh wheels

      - name: 准备部署用虚拟环境
        run: |
          python -m venv "$RUNNER_TEMP/deploy-venv"
          # 修复 buildozer 在 venv 中 --user 安装失败的问题
          sed -i 's/include-system-site-packages = false/include-system-site-packages = true/' "$RUNNER_TEMP/deploy-venv/pyvenv.cfg" || true
          "$RUNNER_TEMP/deploy-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/deploy-venv/bin/pip" install "PySide6==$QT_VERSION" packaging setuptools wheel
          "$RUNNER_TEMP/deploy-venv/bin/python" -c "import PySide6, shiboken6; print(PySide6.__version__)"
          "$RUNNER_TEMP/deploy-venv/bin/pyside6-android-deploy" --help

      - name: 固定 p4a 版本（Python 3.11，匹配 cp311 轮子）
        run: |
          set -euo pipefail
          # 官方 PySide6 6.8.3 的 android 轮子是 cp311（Python 3.11）；
          # 但 p4a develop 已经升到 Python 3.14，装出来的 APK 里只有 libpython3.14.so，
          # 而 libshiboken6.abi3.so 要的是 libpython3.11.so → 启动即 UnsatisfiedLinkError 闪退。
          # 这里往生成的 buildozer.spec 里补一个 p4a.commit，把 p4a 钉死在 Python 3.11.5 的提交上。
          P4A_COMMIT="331e4e4336e50550f0bf6a055c3b1d77cf801bb8"
          SPEC_PY=$(ls "$RUNNER_TEMP"/deploy-venv/lib/python*/site-packages/PySide6/scripts/deploy_lib/android/buildozer.py | head -n 1)
          echo "SPEC_PY=$SPEC_PY"
          grep -n 'p4a.branch", "develop"' "$SPEC_PY"
          sed -i "s|self.set_value(\"app\", \"p4a.branch\", \"develop\")|self.set_value(\"app\", \"p4a.branch\", \"develop\")\n        self.set_value(\"app\", \"p4a.commit\", \"$P4A_COMMIT\")|" "$SPEC_PY"
          grep -n 'p4a.commit' "$SPEC_PY"

      - name: 把题库资产加入打包（source.include_exts 加 db）
        run: |
          set -euo pipefail
          # 让 buildozer 把 android/assets/quiz.db 一起打包进 APK 的 private 归档。
          # 默认 include_exts 不含 db，这里补上，运行时从私有目录解压读取。
          SPEC_PY=$(ls "$RUNNER_TEMP"/deploy-venv/lib/python*/site-packages/PySide6/scripts/deploy_lib/android/buildozer.py | head -n 1)
          echo "SPEC_PY=$SPEC_PY"
          sed -i 's|include_exts = f"{include_exts},qml,js"|include_exts = f"{include_exts},qml,js,db"|' "$SPEC_PY"
          grep -n 'qml,js' "$SPEC_PY"

      - name: 改为正式包名、应用名与版本（构建期补丁 buildozer.py）
        run: |
          set -euo pipefail
          # pyside6-android-deploy 会把包名写成 org.<name>.<name>，应用名也直接用 name。
          # 这里直接改它生成 buildozer.spec 的那几行，落成正式包名 / 中文名称 / 1.0.0 版本。
          SPEC_PY=$(ls "$RUNNER_TEMP"/deploy-venv/lib/python*/site-packages/PySide6/scripts/deploy_lib/android/buildozer.py | head -n 1)
          echo "SPEC_PY=$SPEC_PY"
          SPEC_PY="$SPEC_PY" python3 - <<'PY'
          import os, re, pathlib, sys

          path = pathlib.Path(os.environ["SPEC_PY"])
          src = path.read_text(encoding="utf-8")

          # 注意：buildozer.py 里包名/域名都派生于 pysidedeploy_config.title
          #   self.set_value("app", "package.name", pysidedeploy_config.title)
          #   self.set_value("app", "package.domain", f"org.{pysidedeploy_config.title}")
          # 所以必须直接改这两行，并补一行 version。
          src, n_title = re.subn(
              r'self\.set_value\("app", "title", pysidedeploy_config\.title\)',
              'self.set_value("app", "title", "答题练习软件")\n'
              '        self.set_value("app", "version", "1.0.0")',
              src)
          src, n_name = re.subn(
              r'self\.set_value\("app", "package\.name", pysidedeploy_config\.title\)',
              'self.set_value("app", "package.name", "quiz")',
              src)
          src, n_domain = re.subn(
              r'self\.set_value\("app", "package\.domain",\s*f"org\.\{pysidedeploy_config\.title\}"\)',
              'self.set_value("app", "package.domain", "com.answertraining")',
              src)
          print("PATCH title=%d name=%d domain=%d" % (n_title, n_name, n_domain))
          if n_title != 1 or n_name != 1 or n_domain != 1:
              print("错误：buildozer.py 补丁未全部命中，dump 相关行：")
              for i, line in enumerate(src.splitlines(), 1):
                  if "set_value" in line:
                      print(i, line.strip())
              sys.exit(1)
          path.write_text(src, encoding="utf-8")
          PY
          echo "===== 补丁后的关键行 ====="
          grep -n 'set_value("app", "title"\|set_value("app", "version"\|set_value("app", "package' "$SPEC_PY" || true

      - name: 校验题库资产（android/assets/quiz.db）
        run: |
          set -euo pipefail
          BANK="$GITHUB_WORKSPACE/android/assets/quiz.db"
          test -f "$BANK"
          ls -l "$BANK"
          echo "quiz.db 字节数：$(stat -c%s "$BANK")"
          echo "quiz.db SHA256：$(sha256sum "$BANK" | awk '{print toupper($1)}')"
          test "$(stat -c%s "$BANK")" = "565248"
          test "$(sha256sum "$BANK" | awk '{print toupper($1)}')" = "8943EC01805C6876B0671F3278CF9E00749E12A01E1468D1F3B105BD74176533"

      - name: 打包 debug APK（pyside6-android-deploy）
        working-directory: android
        run: |
          set -x
          export PATH="$RUNNER_TEMP/deploy-venv/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # 让 buildozer 认得出「已在虚拟环境里」，否则它给 p4a 装依赖时加 --user，
          # 与 venv 里的 wheel 版本冲突会直接报错退出（Will not install to the user site ...）
          export VIRTUAL_ENV="$RUNNER_TEMP/deploy-venv"
          # pythonforandroid 要等 deploy 开始后才会被装进环境，所以边构建边等它出现，
          # 出现后立刻补丁 qt bootstrap 的 PythonActivity.java（常亮 + 返回键转发）。
          # 注意：stdout 不能继承给 tee，否则 tee 会一直等这个后台进程退出，
          # 导致整个步骤被拖到 watch 超时。日志单独写文件，之后打印。
          python3 "$GITHUB_WORKSPACE/android/tools/patch_p4a_java.py" \
              --watch --timeout 1800 --marker "$RUNNER_TEMP/p4a_patch_done" \
              > "$RUNNER_TEMP/patcher.log" 2>&1 &
          P4A_PATCHER=$!
          "$RUNNER_TEMP/deploy-venv/bin/pyside6-android-deploy"             --config-file pysidedeploy.spec             --name AnswerTraining             --wheel-pyside "$GITHUB_WORKSPACE/wheels/PySide6-$QT_VERSION-$QT_VERSION-cp311-cp311-android_aarch64.whl"             --wheel-shiboken "$GITHUB_WORKSPACE/wheels/shiboken6-$QT_VERSION-$QT_VERSION-cp311-cp311-android_aarch64.whl"             --ndk-path "$ANDROID_HOME/ndk/$NDK_VERSION"             --sdk-path "$ANDROID_HOME"             --force             --verbose 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          wait "$P4A_PATCHER" || true
          echo "----- patcher.log -----"
          cat "$RUNNER_TEMP/patcher.log" || true
          echo "-----------------------"
          if [ ! -f "$RUNNER_TEMP/p4a_patch_done" ]; then
              echo "错误：p4a 的 PythonActivity.java 补丁没有生效（常亮 / 返回键会失效）"
              exit 1
          fi
          echo "p4a Java 补丁生效：$(cat "$RUNNER_TEMP/p4a_patch_done")"
          # 端到端校验：补丁必须真的进了 dex，否则常亮/返回键在真机上依旧失效
          APK_TMP=$(find "$GITHUB_WORKSPACE" -name '*.apk' -type f | head -n 1)
          echo "临时 APK：$APK_TMP"
          unzip -p "$APK_TMP" "classes*.dex" | grep -aq "back_key.flag" \
              || { echo "错误：dex 里没有 back_key.flag，Java 补丁未进入编译"; exit 1; }
          echo "Java 补丁已进入 APK（dex 校验通过）"

      - name: 用正式密钥重新签名（release 包）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          DEBUG_APK=$(find "$GITHUB_WORKSPACE" -name '*.apk' -type f | head -n 1)
          echo "DEBUG_APK=$DEBUG_APK"
          test -n "$DEBUG_APK"
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          ls -l "$RUNNER_TEMP/release.p12"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          OUT="$GITHUB_WORKSPACE/QuizApp-v1.0.0-release.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 "$DEBUG_APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --min-sdk-version 23 \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"
          echo "===== 签名证书 ====="
          "$APKSIGNER" verify --print-certs "$OUT"
          ls -l "$OUT"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"

      - name: 校验 APK（存在性 / 体积 / Qt 库 / 包名 / 应用名）
        run: |
          set -euo pipefail
          APK="$SIGNED_APK"
          echo "APK=$APK"
          test -f "$APK"
          ls -l "$APK"
          SIZE_MB=$(du -m "$APK" | cut -f1)
          echo "APK_SIZE_MB=$SIZE_MB"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libQt6Widgets|libQt6Core|libQt6Gui|libpyside6|libshiboken6)' || true
          echo "===== 题库资产打包检查 ====="
          python3 -c "import io,sys,tarfile,zipfile;z=zipfile.ZipFile(sys.argv[1]);d=z.read('assets/private.tar');t=tarfile.open(fileobj=io.BytesIO(d));ns=t.getnames();hit=[n for n in ns if n.endswith('assets/quiz.db')];print('private.tar 内 quiz.db:',hit);sys.exit(0 if hit else 1)" "$APK" || { echo "错误：assets/private.tar 内未找到 quiz.db"; unzip -l "$APK" | head -40; exit 1; }
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK")
          echo "$BADGING" | head -5
          echo "===== 应用名 / 图标 ====="
          echo "$BADGING" | grep -E "^application-label|^application-icon|^application:" | head -6
          echo "$BADGING" | grep -q "name='com.answertraining.quiz'" || { echo "错误：包名不是 com.answertraining.quiz"; exit 1; }
          echo "$BADGING" | grep -q "答题练习软件" || { echo "错误：应用名不是 答题练习软件"; exit 1; }

      - name: 失败诊断（OOM / 磁盘 / 关键日志）
        if: failure()
        run: |
          echo '===== dmesg OOM ====='; sudo dmesg | grep -iE 'out of memory|killed process' | tail -20 || true
          echo '===== df ====='; df -h /
          echo '===== deploy.log 尾部 ====='; tail -80 "$RUNNER_TEMP/deploy.log" || true
          echo '===== 关键错误行 ====='; grep -nE 'Error|error:|ERROR|Failed|failed|Killed|No space|Out of memory' "$RUNNER_TEMP/deploy.log" | tail -40 || true

      - name: 上传 artifact：APK / 轮子 / 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-apk
          path: |
            QuizApp-v1.0.0-release.apk
            **/*.apk
            android/assets/icon.png
            android/pysidedeploy.spec
            android/assets/quiz.db.sha256
            wheels/*.whl
            wheels/SHA256SUMS
            ${{ runner.temp }}/deploy.log
          if-no-files-found: warn

  cross-compile:
    name: B / 交叉编译 aarch64 wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    continue-on-error: true
    if: ${{ inputs.run_cross_compile }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 基线信息
        run: |
          df -h /; free -h; nproc; java -version || true

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images || true
          df -h /

      - name: 安装 Python ${{ env.HOST_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 NDK/SDK/交叉编译的 CPython
        uses: actions/cache@v4
        with:
          path: |
            ~/.pyside6_deploy_cache
            ~/Qt
          key: pyside-android-${{ runner.os }}-qt${{ env.QT_VERSION }}-ndk${{ env.NDK_VERSION }}-py${{ env.HOST_PYTHON }}-v1

      - name: 克隆 pyside-setup
        run: |
          git clone --depth 1 --branch "v$QT_VERSION" https://code.qt.io/pyside/pyside-setup ||           git clone --depth 1 --branch "v$QT_VERSION" https://github.com/pyside/pyside-setup pyside-setup
          cd pyside-setup && git log -1 --oneline

      - name: 安装交叉编译依赖
        run: |
          cd pyside-setup
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r tools/cross_compile_android/requirements.txt

      - name: 安装 Qt for Android（交叉编译输入）
        run: |
          python -m pip install aqtinstall
          aqt install-qt linux android "$QT_VERSION" android_arm64_v8a -O "$QT_ROOT"
          du -sh "$QT_ROOT"

      - name: 下载 NDK / SDK 到工具缓存目录
        run: |
          cd pyside-setup
          python tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license
          ls -1 ~/.pyside6_android_deploy 2>/dev/null || ls -1 ~/.pyside6_deploy_cache || true

      - name: 交叉编译 wheel（aarch64）
        run: |
          cd pyside-setup
          python tools/cross_compile_android/main.py             --plat-name aarch64             --qt-install-path "$QT_ROOT/$QT_VERSION"             --ndk-path "$ANDROID_HOME/ndk/$NDK_VERSION"             --sdk-path "$ANDROID_HOME"             --auto-accept-license --skip-update 2>&1 | tee "$RUNNER_TEMP/cross.log"

      - name: 收集轮子
        if: always()
        run: |
          find pyside-setup -name '*android_aarch64.whl' -type f -print -exec ls -lh {} ; | tee "$RUNNER_TEMP/wheels.txt" || true

      - name: 失败诊断
        if: failure()
        run: |
          echo '===== dmesg OOM ====='; sudo dmesg | grep -iE 'out of memory|killed process' | tail -20 || true
          echo '===== 磁盘 ====='; df -h /
          echo '===== cross.log 尾部 ====='; tail -100 "$RUNNER_TEMP/cross.log" || true
          echo '===== 错误行 ====='; grep -nE 'error:|Killed|MemoryError|No space|CMake Error' "$RUNNER_TEMP/cross.log" | tail -40 || true

      - name: 上传 artifact：交叉编译轮子 / 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-wheels-cross
          path: |
            ${{ runner.temp }}/cross.log
            ${{ runner.temp }}/wheels.txt
          if-no-files-found: warn